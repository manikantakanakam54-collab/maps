name: lpu_maps
description: "Smart campus navigation and block finder for Lovely Professional University."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.2
  flutter_compass: ^0.8.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.5.0
  flutter_tts: ^4.2.5
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.1
  image_cropper: ^12.2.1
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lpu_map.png
    - assets/lpu_logo.png
    - assets/robot_splash.png
